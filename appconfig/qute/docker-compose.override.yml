# LibreChat Docker Compose overrides.
# https://www.librechat.ai/docs/configuration/docker_override
services:
  api:
    ports: !override
      - "3081:3080"
    depends_on: !override
      - mongodb
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
    image: registry.librechat.ai/librechat-ai/librechat:latest
    environment:
      - RAG_API_URL=
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MONGO_URI=${MONGO_URI}

  rag_api:
    profiles:
      - donotstart

  # # DISABLE MEILISEARCH
  meilisearch:
    profiles:
      - donotstart

  # # EXPOSE MEILISEARCH PORTS - DO NOT USE THE DEFAULT VALUE FOR THE MASTER KEY IF YOU DO THIS
