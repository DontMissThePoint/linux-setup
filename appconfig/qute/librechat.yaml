version: 1.3.19
cache: true
endpoints:
  custom:
    - name: "Deepseek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v4.1"
      models:
        default:
          [
            "deepseek-flash",
            "deepseek-chat",
            "deepseek-coder",
            "deepseek-reasoner",
          ]
        fetch: false
      titleConvo: true
      titleModel: "deepseek-chat"
      modelDisplayLabel: "Deepseek"
