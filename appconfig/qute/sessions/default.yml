      title: 'combine fzf and xfreerdp option to launch a specific app from my script
        . Upgrade this OPTIONS="Excel\nPowerBi\nDesktop" VAR=$(printf "$OPTIONS" |
        fzf --prompt="Select app: ") xfreerdp3 /u:Dockurr /p:***** /v:127.0.0.1 /port:"$RDP_PORT"
        /cert:ignore /clipboard \ /sound:sys:pulse /microphone:sys:pulse /floatbar
        /compression \ /scale:100 /scale-desktop:110 /f /t:"Dockurr - Windows 11"
        /wm-class:xfreerdp \ ''/app:program:C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE,name:Excel,cmd:""''
        so that it launches what i select not just excel - Google Search'
