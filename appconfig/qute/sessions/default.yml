      title: 'can you modify this script block ads on redroid non-rooted container
        . Or we can use adguard container together. Which is more efficient solution?
        Here''s the code: #!/bin/sh DROID="redroid-android" OPTIONS="15.0.0\n11.0.0"
        FPS="$(docker inspect -f ''{{ .State.Status }}'' windows 2>/dev/null || echo
        ''exited'')" VAR=$(printf "$OPTIONS" | fzf --prompt="Select android image:
        ") IMG="$HOME/VirtualMachines/Android-Docker" # image if [ "$VAR" = "" ];
        then echo "Exiting ..." # handle empty (e.g. ESC) exit 1 fi # Start the container
        if it is not running echo "Waiting for ReDroid to resume..." if [ "$FPS" =
        "exited" ]; then sudo systemctl restart docker fi # android num=$(docker image
        ls | grep -c "$VAR") # bridge if [ "$num" -lt "1" ]; then # redroid sudo systemctl
        daemon-reload sudo systemctl restart docker # env cd "$GIT_PATH"/linux-setup/submodules/"$DROID"
        python3 -m venv venv venv/bin/pip install -r requirements.txt # liteapps,
        magisk venv/bin/python3 redroid.py -a "$VAR" -lg -mnw # reset git reset --hard
        git submodule sync --recursive git submodule update --init --force --recursive
        git clean -ffdx fi # STORAGE STORAGE=""$IMG"/"$VAR":/data" if [ "$VAR" = "11.0.0"
        ]; then IMAGE="redroid/redroid:"$VAR"_litegapps_ndk_magisk_widevine" BRIDGE=libndk_translation.so
        else IMAGE="kylindemons/redroid:"$VAR"_amd64-GApps-Magisk-latest" BRIDGE=libndk_translation.so
        fi # container docker run -itd --rm --privileged \ --name "$DROID" \ --memory
        2G \ --memory-swap 6G \ --cap-add=NET_ADMIN \ -p 5552:5555/tcp \ -p 5900:5900/udp
        \ -v "$STORAGE" \ "$IMAGE" \ androidboot.redroid_width=1600 \ androidboot.redroid_height=1600
        \ androidboot.redroid_dpi=480 \ androidboot.redroid_fps=60 \ androidboot.redroid_gpu_mode=host
        \ androidboot.use_memfd=1 \ redroid.vncserver=1 \ ro.product.cpu.abilist=x86_64,arm64-v8a,x86,armeabi-v7a,armeabi
