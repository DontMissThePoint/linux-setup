services:
  windows:
    image: dockurr/windows
    container_name: windows
    privileged: true
    tty: true
    devices:
      - /dev/kvm
      # - /dev/bus/usb
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    stop_grace_period: 120s
    restart: on-failure
    volumes:
      # Please start with an empty /storage folder: rm -fr /var/win/*
      - ./windows:/storage
      - /home/$USER/Public:/shared
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      USERNAME: "Quickemu"
      PASSWORD: "win11"
      RAM_SIZE: "3G"
      CPU_CORES: "11"
      DISK_SIZE: "64G"
